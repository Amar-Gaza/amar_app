name: amar_app
description: AMAR home services app (Customer and Driver).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.6.6
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  get_storage: ^2.1.1
  intl: any
  lucide_icons_flutter: ^4.0.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.0.5
  uuid: ^4.5.1
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  geocoding: ^4.0.0
  url_launcher: ^6.3.1
  google_maps_flutter: ^2.19.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
